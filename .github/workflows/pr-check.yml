name: PR Quality Check

on:
  pull_request:
    branches: [main]

jobs:
  run-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          
      - name: Run Clang Tidy check
        run: |
          echo "Clang tidy checks successfully triggered by Pull Request!"
          clang-tidy -checks='*' *.cpp -- -std=c++17 || true
          echo "Scan complete! Check the logs above for any warnings."
